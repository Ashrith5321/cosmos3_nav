# OpenFrontier + frontier-conditioned world model (worldmodel/)
# Baseline fields identical to config/navigation.yaml; the world_model
# section enables predictive frontier ranking.

# ------ FrontierNet Model ------
df_normalizer: 10
df_thr: 0.3
num_classes: 11
input_img_size: [320, 320]
focal_length: 300.0

# ------ Frontier Manager ------
filter_bbox: [-11, 10, -16, 4, 0.4, 1.8]    # bounding box for filtering frontiers (x_min, x_max, y_min, y_max, z_min, z_max)
filter_max_vd_z: 0.65                         # max length of viewing direction (unit vector) in z-axis
force_all_frontier_to_xy: False               # force all frontiers to be in the xy plane
filter_min_gain: 0.5                            # minimum gain(volumn in m^3) to be considered as a valid frontier
visited_trans_threshold: 0.5                  # threshold to consider a frontier as visited
visited_angle_threshold: 0.4                  # threshold to consider a frontier as visited
visited_gain_reduction_factor: 2000           # factor to reduce the gain of frontiers based on robot trajectory (the higher the value, the more reduction)
utility_gain_factor: 2.0                      # the higher the value, the more dominant the gain is in the utility function


render_K: [60.0, 0.0, 64.0, 0.0, 60.0, 64.0, 0.0, 0.0, 1.0]   # camera intrinsic matrix for rendering depth from occupancy grid (stay fix)
render_H: 128                                                 # height of the rendered depth image (stay fix)
render_W: 128                                                 # width of the rendered depth image (stay fix)
render_d_range: 3.5                                           # depth range for rendering (stay fix)
render_decrease_factor: 1.0                                   # factor to reduce the gain of frontiers based on the rendered depth image (the higher the value, the more reduction)

# ------ Mapping ------
voxel_size: 0.1         # size of each voxel in meters
depth_range: 3.5        # depth range for volume mapping (wavemap)

# ------ Planning ------
bounds: [-11, 10, -16, 4, 0.4, 1.8]     # bounding box for planning (x_min, x_max, y_min, y_max, z_min, z_max)
use_free_grid: True                       # enable validatiy check with free grid
use_occ_grid: True                        # enable validatiy check with occupied grid
min_dist2occ: 0.2                         # minimum distance to occupied cells to consider a cell as valid
max_dist2free: 0.075                      # maximum distance to free cells to consider a cell as valid
max_planning_time: 1.5                    # maximum planning time (in seconds)
planning_algo: rrtstar                    # planning algorithm to use(rrt, rrtstar, rrtconnect)

# ------ Navigation App ------
predict_interval: 6                   # interval for predicting frontiers (in loop iterations)
plan_interval: 15                     # interval for planning (in loop iterations)
initial_cam_extrinsic:                # initial camera extrinsic matrix
  - [-0.76604444, -0.64278761, -0.0,          0.29643052]
  - [ 0.0,          0.0,         -1.0,          1.0     ]
  - [ 0.64278761, -0.76604444, -0.0,          0.27904303]
  - [ 0.0,          0.0,          0.0,          1.0     ]

observer_cam_extrinsic:               # observer camera extrinsic matrix (top-down view)
  - [-2.19651623e-03, -9.99937606e-01, -1.09525786e-02, -7.20345647e+00]
  - [-9.99869439e-01,  2.02076514e-03,  1.60318772e-02,  6.75098675e-01]
  - [-1.60087443e-02,  1.09863629e-02, -9.99811492e-01,  2.16745306e+01]
  - [ 0.00000000e+00,  0.00000000e+00,  0.00000000e+00,  1.00000000e+00]


# ------ VLM Configurations ------
n_images: 6 # Number of images in the composition fed into the segmentation
termination_threshold: 0.7 # Confidence threshold [0, 1] for object's presence to consider it found
success_threshold: 1.0 # In meters. Target object must be closer than this to stop

seeking_weight: 1.0 # weight for goal-seeking in the utility function (0=pure exploration, 1= agressive seeking)
prob_sharpness: 2.0                        # sharpness factor for probability scaling in the utility function

# See vlm/models.py for options
segmentation_source: sam3
probabilities_source: cosmos3-nano
detection_source: cosmos3-nano
pointnav_weights_path: model_weights/pointnav_weights.pth

# ------ Frontier-Conditioned World Model ------
world_model:
  enabled: true
  backend: zero_shot            # zero_shot (frozen CLIP, no training) | learned (needs checkpoint)
  checkpoint: null              # path to worldmodel/train.py checkpoint (learned backend)

  encoder:
    backend: clip               # clip | dummy (tests only)
    model_name: openai/clip-vit-base-patch32
    device: null                # null = auto (cuda if available)

  num_hypotheses: 4             # K future hypotheses per frontier
  top_m: 4                      # world-model candidates per decision (coarse-to-fine cascade)
  crop_scale: 0.45              # local crop size as a fraction of min(H, W)
  context_blend: 0.65           # crop vs full-frame embedding blend (zero-shot backend)
  room_temperature: 0.02        # CLIP room-posterior softmax temperature
  event_blend: 0.6              # language-event vs context embedding blend

  evaluator:
    temperature: 0.07           # contrast-normalized cosine temperature
    embed_weight: 0.5           # embedding channel weight
    object_weight: 0.5          # predicted-object channel weight (goal in vocab)
    use_vlm: false              # rich VLM re-scoring of predicted language events
    vlm_model: gemini-2.5-flash
    vlm_ambiguity_threshold: 0.05
    beta: 0.5                   # cheap-score weight when mixing with VLM judgment

  cost:
    mode: geodesic              # euclidean (A0) | geodesic (A1+); geodesic only for top-M
    unreachable_penalty: 3.0    # euclidean multiplier when the planner finds no path
    cache_cell: 0.75            # robot-position quantization for geodesic cache reuse

  cache:                        # prediction staleness (design section 12)
    max_age_steps: 24
    move_thresh: 0.6
    min_context_gain: 2

  calibration:                  # closed-loop residuals (design sections 17-18)
    enabled: true
    reveal_radius: 1.2          # distance at which a prediction is checked against reality
    visit_radius: 0.8           # distance at which the frontier counts as consumed
    error_gain: 2.0
    ema_alpha: 0.3
    min_updates: 2
    uncertainty_bonus: 0.05

  ranker:                       # Q_i combination (design sections 14, 49)
    policy: risk_averse         # argmax | ucb | risk_averse
    beta: 0.5
    visit_radius: 1.5
    lambdas:
      obs: 0.25                 # current-frame VLM prior
      wm: 0.40                  # predicted future relevance (mu)
      ig: 0.20                  # information gain
      cost: 0.10                # path cost
      unc: 0.05                 # hypothesis spread (sigma)
      nov: 0.0                  # novelty bonus
      visit: 0.10               # revisit penalty
      risk: 0.0                 # unreachability risk

  record_dataset: false         # record beyond-frontier training data during episodes
  dataset_dir: null             # default: <save_dir>/wm_dataset
  log_decisions: true           # per-step wm_state.jsonl with Q-term breakdowns
