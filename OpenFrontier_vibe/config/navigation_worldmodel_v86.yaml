# --- v86: NOT A CANDIDATE — retained as a record of a refuted change ---------
# v86 was built to tighten the zoomed-crop second opinion, on the reading that
# max(composite, crop) is a monotone loosening of the detector that cost 10
# episodes to false positives against 4 fixed. Two measurements refute that:
#
# 1. That 10-vs-4 came from an early 257-episode paired sample. At n=884 the
#    v85 changes fix 88 and break 62 -- net +26, not the 1:1 trade it looked
#    like. The original reading was small-sample noise.
#
# 2. Tracing which episodes the mechanism actually fired in: the crop rescue
#    flipped the decision in 23 of 84 false positives (27%) but also in 82 of
#    720 successes (11%) -- 3.6 successes per false positive. Tightening it
#    trades ~82 successes for ~23 false positives, and at 55% recovery after a
#    rejection that is roughly -24 episodes per 1000.
#
# The second-chance retry shows the same shape (20 vs 81, 1:4.1). Both v85
# detection-loosening mechanisms are net positive and should be left alone.
strict_stop_verify: false
crop_rescue_band: 0.0
crop_rescue_margin: 0.0
