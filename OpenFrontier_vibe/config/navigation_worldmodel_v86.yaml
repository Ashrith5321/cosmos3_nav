# --- v86: false-positive containment -----------------------------------------
# v85's recognition changes fixed 18 v80 failures and broke 19, and the breakage
# was concentrated in false positives (33% -> 55% of all failures).

# Stop-time strict re-verification is DISABLED, and the measurement is the
# reason. On stop-time frames, a category-discriminative prompt run on a
# full-resolution crop rejects only 21.9% of the false positives the shipped
# detector accepts, while rejecting 4.7-7.0% of the true positives. Measured
# recovery after a rejection is 55.3% (21 of 38 episodes still succeed), so a
# correct rejection is worth +0.55 episodes and a wrong one costs -0.45. At the
# observed ~90:870 FP:success base rate the gate must reject false positives
# 7.9x more often than true positives to break even; the best operating point
# over thresholds 0.1-0.7 reaches 4.7x, i.e. -7 episodes per 1000. The VLM's
# probabilities are bimodal (0.0 or ~1.0), so no threshold recovers it: these
# are confident misidentifications, and re-asking the same model reaffirms 78%
# of them. Fixing them needs a different information source, not a better prompt.
strict_stop_verify: false

# This one survives. The zoomed-crop second opinion used max(composite, crop),
# a monotone loosening of the detector that can only ever add detections -- and
# the paired v80 comparison charges it with 10 newly-broken episodes against 4
# newly-fixed. Restrict the rescue to candidates already near threshold and
# require the crop to clear threshold by a margin.
crop_rescue_band: 0.25
crop_rescue_margin: 0.10
