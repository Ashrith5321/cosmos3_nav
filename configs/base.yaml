# FrontierWorld base experiment configuration.
#
# Every field here is read by frontierworld.config.load_config and is echoed
# into each run directory, so a run can be reproduced from its own log.

experiment:
  name: phase1_smoke
  # Root for run directories. Each run gets <output_dir>/<name>/<run_id>/
  output_dir: outputs
  notes: "Phase 1 gate: run one HM3D ObjectNav episode and save an episode log."

# Determinism. See frontierworld.seeding.seed_everything.
seed:
  value: 0
  # torch.use_deterministic_algorithms + cudnn.deterministic. Slower, but
  # required for the seeded-rerun test in tests/test_seeding.py.
  torch_deterministic: true
  # Habitat's own RNG (episode shuffling, sim noise models).
  seed_habitat: true

data:
  # Paths are resolved relative to the repository root if not absolute.
  scenes_dir: data/scene_datasets
  # HM3D scene dataset config. Required for semantic annotations to load;
  # without it habitat loads the raw .glb stage and semantics come back empty.
  scene_dataset_config: data/scene_datasets/hm3d_v0.2/hm3d_annotated_basis.scene_dataset_config.json
  # ObjectNav episode datasets. HM3D v2 is the evaluation split used in the paper.
  episodes:
    train: data/datasets/objectnav/hm3d/v2/train/train.json.gz
    val: data/datasets/objectnav/hm3d/v2/val/val.json.gz
    val_mini: data/datasets/objectnav/hm3d/v2/val_mini/val_mini.json.gz
  split: val

simulator:
  # Sensor resolution and intrinsics. hfov is horizontal, in degrees.
  width: 640
  height: 480
  hfov: 79
  # Sensor mount height above the agent's base, in metres.
  sensor_height: 0.88
  agent_height: 0.88
  agent_radius: 0.18
  turn_angle: 30
  forward_step_size: 0.25
  # Depth in metres rather than normalised to [0, 1]. The mapper needs metres.
  normalize_depth: false
  min_depth: 0.5
  max_depth: 5.0
  allow_sliding: false
  gpu_device_id: 0

episode:
  max_steps: 200
  # Which episode of the split to run. null means "first episode as ordered
  # by the dataset", which is deterministic given seed.value.
  episode_id: null
  scene_id: null
  # Phase 1 placeholder policy, used only by scripts/run_episode.py. Phase 2
  # frontier policies are configured under `policy` below.
  policy: forward_biased_random
  # Turns in place at episode start, to build a local map before the first
  # frontier decision. 12 turns at 30 degrees is a full circle.
  initial_scan_turns: 12

mapping:
  # Metres per cell.
  resolution: 0.05
  # Square map side length in metres, centred on the agent's start position.
  size_m: 40.0
  # Points in this height band above the floor count as obstacles. Below the
  # lower bound is floor, above the upper bound is ceiling or overhang.
  obstacle_height_min: 0.20
  obstacle_height_max: 1.50
  # Column subsampling stride when projecting depth into the map.
  column_stride: 2
  # A cell needs this many hits before it is called free or occupied.
  min_observations: 1

frontiers:
  # Minimum boundary run to count as a frontier. 8 cells at 0.05 m is 0.4 m,
  # roughly a doorway edge; smaller runs are usually mapping noise.
  min_size_cells: 8
  # Connectivity for boundary detection and clustering (4 or 8).
  connectivity: 8
  # Radius of the disc used for the geometric information-gain proxy.
  info_gain_radius_m: 2.0
  # How far back from the boundary to place the approach point, so the target
  # sits in observed free space rather than on the free/unknown edge.
  approach_offset_m: 0.25
  # Frontiers further than this are treated as unreachable.
  max_travel_distance_m: 30.0

planning:
  # PRIVILEGED: the navmesh planner is ground truth for the whole scene.
  # Ported from OpenFrontier planner/habitat_planner.py. Label it in results.
  planner: habitat_navmesh
  # GreedyGeodesicFollower goal radius; null uses habitat's default.
  goal_radius: null
  # Cap on actions returned for one frontier decision.
  max_actions_per_decision: 200

policy:
  # random | nearest | max_info_gain | info_gain_minus_cost
  name: nearest
  # Weight on travel distance for info_gain_minus_cost, in m2 per metre.
  cost_weight: 1.0

task:
  # Habitat's ObjectNav success threshold, in metres to the nearest goal
  # VIEWPOINT (not to the object itself; viewpoints already sit within about a
  # metre of it). The HM3D benchmark default is 0.1. Raising it loosens success
  # and makes SR/SPL non-comparable to published HM3D ObjectNav results, so
  # state the value used in any reported table.
  success_distance: 1.0

goal_detector:
  # PRIVILEGED: ground-truth semantic instance ids for the episode's goals.
  # Phase 6 replaces this with the predicted target-presence head.
  enabled: true
  min_pixels: 100
  max_detection_distance_m: 5.0
  stop_on_detection: true
  # How close to the detected target the agent must be before calling STOP.
  stop_distance_m: 1.0

recording:
  save_rgb: true
  save_depth: true
  save_semantic: true
  save_pose: true
  save_map: true
  # Save every Nth step. 1 saves every step.
  stride: 1
  # PNG for previewable modalities, npz for arrays.
  depth_format: npz
  semantic_format: npz
  # Write a top-down preview of the occupancy map at the end of the episode.
  save_map_preview: true

logging:
  csv: true
  jsonl: true
  # Only used if tensorboard is importable; absent by default in habitat033.
  tensorboard: false
  # Not installed by default. Set to true only after `pip install wandb`.
  wandb: false
  wandb_project: frontierworld
  log_every: 10
